- id: R26
  satisfies: [UN-1]
  affirmed: 2026-08-08
  affirmations: 2
  requirement: >
    autopilot is a persisted preference, and BOTH its guarantees are enforced: "don't stop to ask"
    (ask-guard.sh) and "keep going instead of stopping while startable work remains"
    (stop-autopilot.sh), the latter bounded by a stall cap and two run bounds
  note: >
    FULLY RE-REVERSED 2026-08-12, owner-decided. Autopilot always bundled two distinct guarantees
    under one flag: ask-guard.sh denying AskUserQuestion, and stop-autopilot.sh forcing the Stop
    hook to continue instead of ending the turn. R100/Pass 4 retired both; R105 (2026-08-08) brought
    back only the first, and R107 (2026-08-09) declined a Stop hook again. This entry now reverses
    BOTH declines, at the owner's request: "I want autopilot to keep going if there are new tasks in
    the queue and it's turned on" (2026-08-11).

    The evidence that decided it was behavioural, not theoretical. STEERING already said "keep
    draining; don't stop to ask", and in the session that produced this change the model stopped
    anyway with a startable task in the queue — the same pattern as the prose that lost twice in the
    owner's original defect report. A nudge the model can skip is not a mode (ADR R36).

    PARTIAL RESTORE, deliberately: 135 of the retired file's 183 lines. Ship-mode auto-commit (R34)
    stays deleted.
    That behaviour now belongs to bin/ship-checkpoint.sh, invoked deliberately rather than on every
    stop — restoring it here would put two owners on one concern.

    THE BURN-DOWN HAND-OFF (R82) WAS ALSO OMITTED, AND THAT WAS REVERSED 2026-08-15 (owner-decided).
    The original argument was duplicate ownership: STEERING told the model to call burn_down itself,
    so automating it here would make that prose false. What the argument missed is that prose is not
    an owner — it is a request. The owner reasonably believed the feature was automatic while
    nothing ever fired it, and the same session proved how that class of instruction fares (0 of 89
    tasks carried the breadcrumbs STEERING has demanded since R47). Ownership is not duplicated now
    because the STEERING sentence was rewritten in the SAME change, and the split follows R28/R81:
    the hook owns WHETHER to continue (one cheap should-burn call, measured at 23ms on an empty
    store), the model owns WHAT to build — candidates.sh git-greps the whole repo and must never run
    inside a hook. A prerequisite shipped with it: candidates rank 1 now requires evidence the owner
    SAW the park, or the restored trigger would let an unattended run build the model's own
    unreviewed recommendation.

    What returned is the continuation guarantee plus EVERY terminator that bounds it: the no-progress stall cap
    (CLAUDE_COMPANION_AUTOPILOT_MAX, 8), the R81 wall-clock and total-turn run bounds, the R77 sweep
    terminator, and the CLAUDE_COMPANION_AUTOPILOT_CONTINUE=0 kill switch. Restoring the
    continuation WITHOUT its bounds would have been the one genuinely dangerous version.

    Cost stated where it was chosen: this is Claude-Code-only, so MCP clients (Cursor) get nothing
    from it — R100's portability thesis pays for it.
  verified_by:
    - "autopilot: toggle persists per repo, independent of other modes (R26)"
    - "ask-guard: autopilot ON denies AND auto-parks the question with its real options + a recommendation (R84)"
    - "ask-guard: autopilot OFF silently allows — no denial, no park"
    - "stop-autopilot: armed + a startable task BLOCKS the stop; a drained queue allows it (R26 restored)"
    - "stop-autopilot: a DRY queue with burn-down armed and a BURN verdict refuses the stop (R82 hand-off restored)"
    - "stop-autopilot: the kill switch and its bounds all yield; ship-mode stays dead, burn-down hands off (R26/R81/R82)"

