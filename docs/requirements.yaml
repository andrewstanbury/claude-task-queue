- id: R60
  satisfies: [UN-4]
  requirement: >
    the queue travels with the repository, carried by git alone
  note: >
    REVERSED 2026-08-05, owner-decided. R60 used to mean an EXPORT/IMPORT pair that ferried the open
    queue between machines through a committed .companion/queue.json. Since R96 the queue itself
    lives in <repo>/.companion/tasks and travels with git, so the export duplicated what git already
    carried — and could carry something git never would: a STALE copy. It did exactly that:
    /companion:resume auto-imported a three-day-old export and resurrected 13 COMPLETED tasks into a
    fresh session, which is the rework this product exists to prevent. `tq export`, `tq import`,
    their six tests, the ship-time export step and the carry-tasks flow page are all deleted; git is
    now the only transport, which is what R72's handoff already assumed.
  judgment: "verified by ABSENCE — no code path writes or reads .companion/queue.json once the mechanism is deleted; there is nothing to assert positively"
  verified_by: []

