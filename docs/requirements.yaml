- id: R112
  satisfies: [UN-2]
  affirmed: 2026-08-12
  affirmations: 0
  requirement: >
    the review opens with a multi-select ACCEPT SWEEP over the parks the owner already agrees with,
    and an unticked option is never read as a rejection
  note: >
    Owner-asked 2026-08-12: "I want the plugin to give me recommendations to pick from... using
    Claude CLI with my arrow keys and by pressing enter." The arrow-key picker already existed —
    review has always driven `AskUserQuestion` — so what was actually missing was the BATCH. Every
    park was its own single-select menu, which made agreeing with a recommendation cost the same
    interaction as overruling it, and turned a twelve-item pile into three rounds.

    The tool takes 2-4 options per question and up to 4 questions per call, so the sweep groups
    parks into questions of four: 16 accepted per interaction against 4 under the per-item path.

    THE SAFETY PROPERTY, and the reason this is a requirement rather than a preference: a
    multiSelect returns only the PRESENCE of a yes. There is no "no" in the payload. A review that
    read an unticked box as a rejection would silently invent decisions across the whole pile —
    strictly worse than the drip-feed it replaces, and a direct violation of UN-2 ("I do not want
    anything else pretending to be a decision"). Unticked therefore means "ask me properly": the
    item falls through to its own full single-select with its options intact.

    Excluded, each for its own reason: `⏳` blocked items (an owner ACTION is not a recommendation
    to accept), `decompose:` parks (R65 — they carry questions, not options, so there is nothing to
    accept yet), and any park whose `rec:` is a thin guess rather than a real pick. Irreversible
    parks ARE sweepable — the owner is consciously picking, unlike R77 sweep mode where the agent
    applies `rev:` picks unattended — but they are labelled `⚠ IRREVERSIBLE` so a batch tick cannot
    hide a one-way door.

    Prose, so the ceiling is R28/R56·P3: a structural guard pins that the sweep and its
    absence-is-not-rejection rule were not deleted. It cannot pin that they are obeyed.
  verified_by:
