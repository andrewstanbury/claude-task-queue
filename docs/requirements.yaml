    exemption is named, printed on every run, and goes RED once the debt it documents is paid
  note: >
    Found 2026-08-11 by asking why the 300-line size guard reported green with `bin/tq` at 382
    lines. `scripts=(check.sh plugins/*/bin/*.sh plugins/*/lib/*.sh)` globs on `.sh`, and `tq` is
