  note: >
    Owner, verbatim: "Claude seems to be making more and more obvious mistakes requiring rework then
    telling me about how it caught the mistakes." Reporting a caught mistake as an apparatus win
    reframes a defect rate as a success; a count cannot be spun. It records FAILURE events, never
    touch counts — measured before building: a file-churn metric on this repo ranked version
