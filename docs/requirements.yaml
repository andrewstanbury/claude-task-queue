    reports the agent's own layer instead of the owner's, and always readable back
  note: >
    Owner-reported 2026-08-10, from four misses with one shape: completion declared at the boundary
    of what a shell can observe, when the owner's experience of the work lived one layer further
    out. A fix written, tested, committed and reported done that was never DEPLOYED; a route move
    proved by a typecheck that cannot see string-typed router paths; an approval gate whose refuse
    path was proved and whose accept path was declared untestable while `pty.openpty()` was
    available the whole time; a bundle server three days stale while code and API were inspected
    instead. Every check run was real; none was the check that mattered.

    OPTIONAL BY DESIGN. Mandatory evidence would gate every routine close behind prose and train
    exactly the rubber-stamping the gate exists to refuse — the same reasoning R78 records for
    `--da`. The guard runs BEFORE the state change: a gate that complains about a task it has
    already closed is decorative, so a refusal leaves the task OPEN.

    NAMED LIMIT, and it is the honest one. This cannot verify that anything was observed — no shell
    check can (the R28 ceiling da-gate.sh states about its own pass), and it is FABRICABLE BY
    DESIGN. It can tell that evidence is thin; it can never tell that it is about the right layer.
    What it buys is that the claim is WRITTEN in the owner's terms at the moment of closing, where
    `tq list` makes the gap between "tests pass" and "I opened it" legible to a human. The reader is
    not decoration: a field nobody prints is R58·a's retired capture hook (456KB banked, zero
    readers), which is why the render is pinned by its own assertion.

    GENERIC (R9): the denylist is plain-English self-referential completion talk, never an
    ecosystem, language or framework table. Recognising what a bundle server or a simulator is
    stays the model's job.

    THE STEERING HALF LANDED 2026-08-12 (owner: "do it for me"), and it is the part that actually
    addresses the deepest of the four misses. `--seen` cannot: an agent that rules something
    untestable never produces evidence to guard, because it never tried. The reflex reframes that
    ruling as what it is — a DECISION, verification traded for delivery, wearing the costume of a
    fact about the world — so it reaches the owner as a `❓` instead of shipping. `pty.openpty()`
    was available the whole time.

    It cost the FIFTH cap raise (8576 -> 8730), a conscious override of `check.sh`'s recorded "if a
